[package]
name = "vello_bench"
description = "Benchmarking harness for sparse strips."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
test = false

[dependencies]
vello_common = { workspace = true }
vello_cpu = { workspace = true }
vello_dev_macros = { workspace = true }
criterion = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
parley = { version = "0.11.0", default-features = true }
rand = { workspace = true, features = ["small_rng"] }
smallvec = { workspace = true }
usvg = { workspace = true }

# Tango spawns the baseline and candidate benchmarks as child processes, which wasm32 lacks.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tango-bench = { version = "0.9.0", optional = true }

[features]
extended = []
# Enables the `tango` bench target for paired comparisons against a baseline build.
tango = ["dep:tango-bench"]

[[bench]]
name = "main"
harness = false

[[bench]]
name = "tango"
harness = false
required-features = ["tango"]

[[test]]
name = "allocations"
harness = false

[lints]
workspace = true
