<html>

<head>
  <title>Vello CPU Web Demo</title>
  <meta charset=utf-8>
  <meta content="width=device-width,initial-scale=1" name=viewport>
  <meta content=no-cache http-equiv=Cache-control>
  <meta content=-1 http-equiv=Expires>
  <script type=module>import init from"./wasm_cpu.js";await init();</script>
  <link as=fetch crossorigin href=./wasm_cpu_bg.wasm rel=preload type=application/wasm>
  <link crossorigin href=./wasm_cpu.js rel=modulepreload>
</head>

<body>
  <select aria-label="Vello demo" class="demo-selector" onchange="location.href=this.value">
    <option value=/vello />Direct WebGL2</option>
    <option value=/vello/wgpu-webgl />WebGL2 via wgpu</option>
    <option value=/vello/wgpu-webgpu />WebGPU via wgpu</option>
    <option selected value=/vello/cpu />Vello CPU</option>
    <option value=/vello/research />Research</option>
  </select>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .demo-selector {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      padding: 6px 10px;
      border: 1px solid #555;
      border-radius: 5px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
    }
  </style>
</body>

</html>
