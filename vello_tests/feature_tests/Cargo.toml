[package]
name = "vello_gpu_feature_tests"
description = "Rendering snapshot tests for Vello GPU shader feature combinations"
categories = ["development-tools::testing", "graphics"]
keywords = ["testing", "rendering", "snapshots"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[[test]]
name = "features"
path = "tests/features.rs"

[dependencies]
vello_common = { workspace = true, features = ["std", "png", "probe"] }
vello_gpu = { workspace = true, default-features = false, features = ["probe", "text"] }
vello_test_support = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { version = "0.3.0", path = "../../vello_cpu", default-features = false, features = [
    "std",
    "f32_pipeline",
] }
wgpu = { workspace = true, default-features = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
] }

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "vello_gpu/wgpu_default"]
webgl = ["vello_gpu/webgl"]
blurred_rounded_rect = ["vello_gpu/blurred_rounded_rect"]
image_bicubic = ["vello_gpu/image_bicubic"]
gradient_sweep = ["vello_gpu/gradient_sweep"]

[lints]
workspace = true
